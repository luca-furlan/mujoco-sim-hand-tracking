<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>G1 + Mani — VR teleop + Teaching</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; background: #000; color: #e8e8e8; }
    #hud { position: fixed; left: 10px; top: 10px; z-index: 100; background: rgba(0,0,0,.6);
      padding: 10px 14px; border-radius: 8px; font-size: 13px; max-width: 420px; }
    #hud.vr-hidden { visibility: hidden; width: 0; height: 0; overflow: hidden; padding: 0; margin: 0; border: none; }
    #xr-foot { position: fixed; left: 8px; right: 8px; bottom: 12px; z-index: 150; text-align: center;
      font-size: 13px; color: #e2e8f0; text-shadow: 0 0 6px #000, 0 0 12px #000; pointer-events: none;
      display: none; line-height: 1.35; }
    #xr-foot.on { display: block; }
    #vr-tools {
      position: fixed; left: 10px; bottom: 10px; z-index: 200; display: block;
      background: rgba(15,23,42,.92); padding: 10px 14px; border-radius: 10px; font-size: 13px;
      border: 1px solid rgba(148,163,184,.35); max-width: 320px; box-shadow: 0 4px 24px rgba(0,0,0,.4);
    }
    #vr-tools.vr-hidden { display: none; }
    #vr-tools label { cursor: pointer; display: flex; align-items: center; gap: 10px; user-select: none; }
    #vr-tools input { width: 18px; height: 18px; accent-color: #38bdf8; }
    #vr-tools .hint { margin-top: 8px; font-size: 11px; color: #94a3b8; line-height: 1.35; }
    button { margin: 4px 4px 0 0; padding: 8px 14px; border: none; border-radius: 6px;
      background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; font-size: 13px; }
    button:hover { background: #1d4ed8; }
    button.active { outline: 2px solid #38bdf8; outline-offset: 1px; }
    button.btn-danger { background: #dc2626; }
    button.btn-danger:hover { background: #b91c1c; }
    button.btn-green { background: #16a34a; }
    button.btn-green:hover { background: #15803d; }
    button.btn-amber { background: #d97706; }
    button.btn-amber:hover { background: #b45309; }
    #status { margin-top: 8px; color: #94a3b8; font-size: 12px; line-height: 1.4; }
    #mode-panel {
      position: fixed; right: 10px; top: 10px; z-index: 200;
      background: rgba(15,23,42,.95); padding: 12px 16px; border-radius: 10px;
      border: 1px solid rgba(148,163,184,.35); max-width: 300px;
      box-shadow: 0 4px 24px rgba(0,0,0,.4); font-size: 13px;
    }
    #mode-panel h3 { margin: 0 0 8px 0; font-size: 14px; color: #e2e8f0; }
    #mode-panel .mode-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    #mode-panel select { width: 100%; padding: 6px 8px; border-radius: 6px; background: #1e293b;
      color: #e2e8f0; border: 1px solid #475569; font-size: 12px; margin-bottom: 6px; }
    #mode-panel .rec-controls { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
    #mode-panel label { cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 12px; }
    #mode-panel input[type="checkbox"] { width: 16px; height: 16px; accent-color: #38bdf8; }
    #mode-status { font-weight: 700; font-size: 16px; text-align: center; padding: 6px 0; }
    .mode-idle { color: #64748b; }
    .mode-realtime { color: #38bdf8; }
    .mode-recording { color: #ef4444; animation: blink 1s infinite; }
    .mode-playback { color: #22c55e; }
    @keyframes blink { 50% { opacity: 0.5; } }
  </style>
</head>
<body>
  <div id="hud">
    <button type="button" id="btn-vr">VR</button>
    <strong>G1 + Mani</strong> — teleop VR, 2 tavoli mirror (~2m), robot davanti
    <div id="status">Connessione…</div>
  </div>
  <div id="vr-tools">
    <label>
      <input type="checkbox" id="chk-passthrough" />
      Passthrough / camera mista (AR)
    </label>
    <div class="hint">AR: stanza reale + tavoli e robot visibili. In VR normale sfondo scuro — robot e tavoli restano visibili.</div>
  </div>
  <div id="mode-panel" style="display:none">
    <h3>Modalita'</h3>
    <div id="mode-status" class="mode-idle">IDLE</div>
    <div class="mode-btns">
      <button type="button" id="btn-realtime" class="btn-green">Realtime</button>
      <button type="button" id="btn-record" class="btn-danger">Registra</button>
      <button type="button" id="btn-stop">Stop</button>
    </div>
    <select id="sel-recording"><option value="">(nessuna registrazione)</option></select>
    <div class="rec-controls">
      <button type="button" id="btn-playback" class="btn-amber">Play</button>
      <button type="button" id="btn-delete-rec" class="btn-danger" style="font-size:11px;padding:6px 10px;">Elimina</button>
      <label><input type="checkbox" id="chk-loop" /> Loop</label>
    </div>
  </div>
  <div id="xr-foot" aria-live="polite"></div>
  <script type="importmap">
  {
    "imports": {
      "three": "/static/vendor/three.module.js",
      "three/addons/": "/static/vendor/three/examples/jsm/",
      "cannon-es": "/static/vendor/cannon-es.js"
    }
  }
  </script>
  <script type="module" src="/static/app.js?v=mirror20"></script>
</body>
</html>
